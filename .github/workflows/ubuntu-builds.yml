name: Ubuntu Builds

on: [ pull_request, push, workflow_dispatch, workflow_call ]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-24.04, ubuntu-22.04 ]
        preset: [ gcc, gcc-debug, clang, clang-debug, clang-lto ]

    runs-on: "${{ matrix.os }}"

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install dependencies
        run: sudo scripts/install_dependencies.sh

      - name: Configure
        run: >
          cmake --preset "${{ matrix.preset }}"
          -DLIBQEMU_TARGETS="aarch64;hexagon"

      - name: Build
        run: cmake --build --preset "${{ matrix.preset }}" --parallel $(nproc)

      - name: Test
        run: ctest --preset "${{ matrix.preset }}"

      - name: Install qbox
        if: matrix.os == 'ubuntu-24.04' && matrix.preset == 'gcc'
        run: cmake --install build

      - name: Package qbox install tree
        if: matrix.os == 'ubuntu-24.04' && matrix.preset == 'gcc'
        run: tar -C build -cf qbox-install.tar install

       - name: Upload qbox install tree
         if: matrix.os == 'ubuntu-24.04' && matrix.preset == 'gcc'
         uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: qbox-install-ubuntu-24.04-gcc
          path: qbox-install.tar
          compression-level: 0
          retention-days: 1

  hello-qbox:
    name: Build and run hello-qbox
    needs: build
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install dependencies
        run: |
          sudo scripts/install_dependencies.sh
          sudo apt-get install -y gcc-aarch64-linux-gnu

       - name: Download qbox install tree
         uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: qbox-install-ubuntu-24.04-gcc
          path: "${{ runner.temp }}/qbox-artifact"

      - name: Extract qbox install tree
        run: |
          mkdir -p "${{ runner.temp }}/qbox-install"
          tar -C "${{ runner.temp }}/qbox-install" --strip-components=1 \
            -xf "${{ runner.temp }}/qbox-artifact/qbox-install.tar"

      - name: Configure hello-qbox
        run: >
          cmake -S examples/hello-qbox -B examples/hello-qbox/build
          -DCMAKE_PREFIX_PATH="${{ runner.temp }}/qbox-install"

      - name: Build hello-qbox
        run: cmake --build examples/hello-qbox/build --parallel $(nproc)

      - name: Run hello-qbox and check output
        working-directory: examples/hello-qbox
        run: |
          set -o pipefail
          timeout 5s ./build/hello-qbox-vp --gs_luafile platform.lua \
            2>&1 | tee run.log
          grep -Fq 'Hello from Qbox!' run.log
