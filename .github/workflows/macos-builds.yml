name: macOS Builds

on: [ pull_request, push, workflow_dispatch, workflow_call ]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ macOS-15, macOS-26 ]
        preset: [ mac, mac-debug ]

    runs-on: "${{ matrix.os }}"

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          export QBOX_PYTHON_VENV="$RUNNER_TEMP/qbox-python"
          echo "QBOX_PYTHON_VENV=$QBOX_PYTHON_VENV" >> "$GITHUB_ENV"
          scripts/install_dependencies.sh
          "$QBOX_PYTHON_VENV/bin/python" -c 'import sys, pexpect, numpy; print(sys.executable)'

      - name: Configure
        run: >
          cmake --preset "${{ matrix.preset }}"
          -DLIBQEMU_TARGETS="aarch64;hexagon"
          -DPython3_EXECUTABLE="$QBOX_PYTHON_VENV/bin/python"

      - name: Build
        run: cmake --build --preset "${{ matrix.preset }}" --parallel $(sysctl -n hw.logicalcpu)

      - name: Test
        run: ctest --preset "${{ matrix.preset }}"
