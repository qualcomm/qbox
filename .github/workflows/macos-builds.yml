name: macOS Builds

on: [ pull_request, push, workflow_dispatch, workflow_call ]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ macOS-15, macOS-26 ]
        preset: [ mac, mac-debug ]

    runs-on: "${{ matrix.os }}"

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install Python test dependencies
        run: python -m pip install pexpect numpy

      - name: Install dependencies
        run: scripts/install_dependencies.sh

      - name: Configure
        run: >
          cmake --preset "${{ matrix.preset }}"
          -DLIBQEMU_TARGETS="aarch64;hexagon"

      - name: Build
        run: cmake --build --preset "${{ matrix.preset }}" --parallel $(sysctl -n hw.logicalcpu)

      - name: Test
        run: ctest --preset "${{ matrix.preset }}"
